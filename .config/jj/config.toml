#:schema https://docs.jj-vcs.dev/latest/config-schema.json

[user]
name = "xdagiz"
email = "xdagiz@protonmail.com"

[ui]
editor = "nvim"
diff-editor = ":builtin"
diff-formatter = ":git"
default-command = "log"

[aliases]
tug = ["util", "exec", "--", "sh", "-c", """
  if [ -n "$1" ]; then
    jj bookmark move "$1" --to 'closest_pushable(@)'
  else
    jj bookmark move --from 'closest_bookmark(@)' --to 'closest_pushable(@)'
  fi
""", "sh"]
tugp = ["util", "exec", "--", "sh", "-c", """
  if [ -n "$1" ]; then
    jj bookmark move "$1" --to 'closest_pushable(@)'
    jj git push --bookmark "$1"
  else
    jj bookmark move --from 'closest_bookmark(@)' --to 'closest_pushable(@)'
    jj git push --bookmark 'closest_pushable(@)'
  fi
""", "sh"]
b = [
  "util",
  "exec",
  "--",
  "bash",
  "-c",
  """
    if [[ $# -gt 0 ]]; then N=$1; shift; else N=1; fi
    resolve () { jj log --no-graph -r@ -T'change_id.short() ++ "\\n"' "$@"; }
    current=$(resolve)
    jj op log --no-graph -T 'id.short() ++ "\\n"' | while read op; do
        old=$(resolve --at-op $op)
        if [[ $old != $current ]]; then
            echo -n "$N      \r"
            N=$(( $N - 1 ))
            if [[ $N -eq 0 ]]; then
                echo -n "        \r"
                if ! jj edit $old 2>/dev/null; then
                    # Handle temporary problem with evolution moving to the op log.
                    old_commit="$(jj evolog -r $old --at-op $op --no-graph -n1 -T 'commit.commit_id().short() ++ ":"')"
                    old_commit="${old_commit%%:*}"
                    echo "$old not found, trying commit $old_commit"
                    jj edit $old_commit
                fi
                exit 0
            fi
            current="$old"
        fi
    done
""",
  "jj-back",
]
# tug = ["bookmark", "move", "--from", "heads(::@- & bookmarks())", "--to", "@-"]
bm = ["bookmark"]
gf = ["git", "fetch"]
gp = ["git", "push"]
init = ["git", "init", "--colocate"]
rebm = ["rebase", "-r@", "--onto", "main"]
stack = ["log", "-r", "stack()"]

[template-aliases]
# 'format_timestamp(timestamp)' = 'timestamp.local().format("%Y-%m-%d %I:%M:%S %p")'
'format_timestamp(timestamp)' = 'timestamp.ago()'
'format_short_signature(signature)' = 'signature.email().local()'

[revset-aliases]
# Your commits that aren't immutable (trunk/tags/remote branches)
# Shows all your mutable work across the repo
'wip()' = 'mine() ~ immutable()'

# Your commits not yet merged into trunk
# Shows your unmerged/unpushed work
'open()' = 'mine() ~ ::trunk()'

# Find the nearest bookmark in ancestry from a revision
# Used by tug alias to find which bookmark to advance
'closest_bookmark(to)' = 'heads(::to & bookmarks())'

# Find the nearest "pushable" commit - non-empty with a description
# Skips empty WIP commits when advancing bookmarks
'closest_pushable(to)' = 'heads(::to & mutable() & ~description(exact:"") & (~empty() | merges()))'

# Show current branch from @ to its leaf commits
'current()' = '@:: & mutable()'

# Show your entire stack - all mutable commits connected to @
# reachable() finds commits reachable in any direction (ancestors + descendants)
# within the mutable() set (excludes immutable trunk/tags)
'stack()' = 'reachable(@, mutable())'

[[--scope]]
--when.commands = ["diff","show"]

[--scope.ui]
pager = "delta"
diff.format = "git"
